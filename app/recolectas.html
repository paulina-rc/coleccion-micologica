<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Recolectas · Colección Micológica</title>
    <link rel="stylesheet" href="/src/css/app.css" />
  </head>
  <body class="is-loading">
    <main class="page">
      <div class="page__head">
        <h1 class="page__title">
          Recolectas <span class="specimen-count" id="specimen-count"></span>
        </h1>
        <!-- El href relativo funciona solo (las dos páginas están en app/);
             recolectas.js lo reemplaza por la ruta completa con url(). -->
        <a class="btn btn--yellow" id="new-specimen" href="recolecta-editar.html">
          + Nueva recolecta
        </a>
      </div>

      <!-- Las tarjetas las crea src/specimen-card.js -->
      <ul class="specimen-grid" id="specimen-list"></ul>

      <!-- Sin recolectas o error de conexión. role="status": el lector de
           pantalla lo anuncia apenas aparece. -->
      <div class="list-message" id="list-message" role="status" hidden></div>
    </main>

    <script type="module" src="/src/pages/recolectas.js"></script>
  </body>
</html>
