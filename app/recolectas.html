<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Recolectas · Colección Micológica</title>
    <link rel="stylesheet" href="/src/css/app.css" />
  </head>
  <body class="is-loading">
    <main class="page">
      <div class="page__head">
        <h1 class="page__title">
          Recolectas <span class="specimen-count" id="specimen-count"></span>
        </h1>
        <!-- El href relativo funciona solo (las dos páginas están en app/);
             recolectas.js lo reemplaza por la ruta completa con url(). -->
        <a class="btn btn--yellow" id="new-specimen" href="recolecta-editar.html">
          + Nueva recolecta
        </a>
      </div>

      <div class="list-toolbar">
        <!-- role="search": los lectores de pantalla lo anuncian como buscador -->
        <div class="field list-search" role="search">
          <label class="visually-hidden" for="specimen-search">Buscar recolectas</label>
          <input
            type="search"
            id="specimen-search"
            placeholder="Código, nombre, gira, sitio o localidad"
            autocomplete="off"
            spellcheck="false"
            disabled
          />
        </div>
        <!-- Filtros por estado; los botones los crea recolectas.js con
             STATUS_FILTERS (src/specimen-filters.js). -->
        <div class="chips" id="status-filters" role="group" aria-label="Filtrar por estado"></div>
        <!-- Orden, familia, gira y sitio; las listas las llena recolectas.js
             con las opciones que existen en las recolectas. -->
        <div class="list-filters" id="field-filters"></div>
        <!-- "3 de 76 recolectas" mientras hay búsqueda; aria-live lo lee
             sin mover el foco del buscador. -->
        <p class="list-summary" id="list-summary" aria-live="polite"></p>
      </div>

      <!-- Las tarjetas las crea src/specimen-card.js -->
      <ul class="specimen-grid" id="specimen-list"></ul>

      <!-- Sin recolectas o error de conexión. role="status": el lector de
           pantalla lo anuncia apenas aparece. -->
      <div class="list-message" id="list-message" role="status" hidden></div>
    </main>

    <script type="module" src="/src/pages/recolectas.js"></script>
  </body>
</html>
